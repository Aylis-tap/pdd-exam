name: Download PDD Database

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official PDD database
        run: |
          curl -sL "https://cdn.jsdelivr.net/gh/Blind4Basics/PDD_Russia@master/data/abm.json" -o pdd.json

      - name: Commit and push file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pdd.json
          git commit -m "Add official 400 questions pdd.json" || exit 0
          git push
