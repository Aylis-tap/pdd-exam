<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экзамен ПДД 2026 (Кат. B) — Вопросы 1–10</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .logo { font-size: 1.25rem; font-weight: 700; color: #60a5fa; }
    .nav-stats { display: flex; gap: 0.75rem; font-size: 0.9rem; }
    .badge { padding: 0.35rem 0.75rem; border-radius: 9999px; background: #334155; color: #e2e8f0; font-weight: 500; }
    .badge.success { background: #064e3b; color: #6ee7b7; }
    .badge.danger { background: #7f1d1d; color: #fca5a5; }
    main { flex: 1; max-width: 860px; width: 100%; margin: 1.5rem auto; padding: 0 1rem 2rem; }
    .ticket-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 0.4rem; margin-bottom: 1.5rem; }
    .ticket-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.25rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-align: center; }
    .ticket-btn:hover { background: #334155; }
    .ticket-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .question-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 0.4rem; }
    .q-tab { flex: 1; min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); user-select: none; }
    .q-tab.active { border-color: #60a5fa; color: white; outline: 2px solid #60a5fa; }
    .q-tab.correct { background: var(--correct); color: white; border-color: var(--correct); }
    .q-tab.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .q-media { width: 100%; background: #0b1120; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); min-height: 220px; }
    .q-media img { max-width: 100%; max-height: 360px; display: block; object-fit: contain; }
    .q-media.empty { display: none; }
    .q-body { padding: 1.5rem; }
    .q-title { font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.5rem; font-weight: 600; }
    .answers { display: flex; flex-direction: column; gap: 0.65rem; }
    .ans-btn { background: #182234; border: 1px solid var(--border); color: var(--text); padding: 0.85rem 1.1rem; border-radius: 8px; text-align: left; cursor: pointer; font-size: 0.95rem; line-height: 1.4; }
    .ans-btn:hover:not(:disabled) { background: #23334d; border-color: #475569; }
    .ans-btn.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: var(--correct) !important; color: #6ee7b7 !important; }
    .ans-btn.wrong { background: rgba(239, 68, 68, 0.25) !important; border-color: var(--wrong) !important; color: #fca5a5 !important; }
    .comment-box { margin-top: 1.25rem; padding: 1rem 1.25rem; background: #0f172a; border-left: 4px solid var(--accent); border-radius: 4px; font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; display: none; }
    .controls { display: flex; justify-content: space-between; margin-top: 1.25rem; }
    .btn { padding: 0.6rem 1.25rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #loader { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">Экзамен ПДД (Вопросы 1–10 из 40 билетов)</div>
  <div class="nav-stats">
    <span class="badge" id="ticketBadge">Билет 1 / 40</span>
    <span class="badge success" id="correctBadge">Верно: 0</span>
    <span class="badge danger" id="wrongBadge">Ошибок: 0</span>
  </div>
</header>

<main>
  <div id="loader">Загрузка локальной базы билетов...</div>

  <div id="app" style="display: none;">
    <div class="ticket-selector" id="ticketList"></div>
    <div class="question-tabs" id="tabsList"></div>

    <div class="card">
      <div class="q-media" id="mediaBox">
        <img id="qImg" src="" alt="Иллюстрация к вопросу" onerror="this.parentElement.classList.add('empty')">
      </div>
      <div class="q-body">
        <div class="q-title" id="qTitle"></div>
        <div class="answers" id="ansList"></div>
        <div class="comment-box" id="commentBox"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" onclick="prevQuestion()">← Назад</button>
      <button class="btn" id="nextBtn" onclick="nextQuestion()">Вперед →</button>
    </div>
  </div>
</main>

<script>
  let tickets = {};
  let currentTicket = 1;
  let currentQuestionIndex = 0;
  let userAnswers = {};

  async function init() {
    try {
      const res = await fetch('./pdd.json');
      const raw = await res.json();

      for (let t = 1; t <= 40; t++) tickets[t] = [];

      raw.forEach(item => {
        let t = parseInt(item.ticket_number || (item.ticket && String(item.ticket).replace(/\D/g, '')) || 0, 10);
        let q = parseInt(item.question_number || (item.number && String(item.number).replace(/\D/g, '')) || 0, 10);

        if (t >= 1 && t <= 40 && q >= 1 && q <= 10) {
          tickets[t].push({
            num: q,
            title: item.title || item.question || '',
            image: item.image || '',
            answers: item.answers || [],
            correct: item.correct_answer,
            comment: item.comment || item.answer_tip || item.description || ''
          });
        }
      });

      for (let t = 1; t <= 40; t++) tickets[t].sort((a, b) => a.num - b.num);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      renderTicketSelector();
      selectTicket(1);
    } catch (e) {
      document.getElementById('loader').innerHTML = 
        '<span style="color:#ef4444">Ошибка чтения pdd.json: ' + e.message + '</span>';
    }
  }

  function renderTicketSelector() {
    const box = document.getElementById('ticketList');
    box.innerHTML = '';
    for (let i = 1; i <= 40; i++) {
      const btn = document.createElement('button');
      btn.className = 'ticket-btn' + (i === currentTicket ? ' active' : '');
      btn.innerText = `Б ${i}`;
      btn.onclick = () => selectTicket(i);
      box.appendChild(btn);
    }
  }

  function selectTicket(num) {
    currentTicket = num;
    currentQuestionIndex = 0;
    document.querySelectorAll('.ticket-btn').forEach((b, idx) => b.classList.toggle('active', (idx + 1) === num));
    document.getElementById('ticketBadge').innerText = `Билет ${currentTicket} / 40`;
    renderQuestionTabs();
    renderQuestion();
  }

  function renderQuestionTabs() {
    const list = document.getElementById('tabsList');
    list.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const tab = document.createElement('div');
      tab.className = 'q-tab' + (i === currentQuestionIndex ? ' active' : '');
      tab.innerText = i + 1;
      const state = userAnswers[`${currentTicket}-${i}`];
      if (state) tab.classList.add(state.isCorrect ? 'correct' : 'wrong');
      tab.onclick = () => {
        currentQuestionIndex = i;
        renderQuestionTabs();
        renderQuestion();
      };
      list.appendChild(tab);
    }
  }

  function renderQuestion() {
    const list = tickets[currentTicket] || [];
    const q = list[currentQuestionIndex];
    if (!q) return;

    const mediaBox = document.getElementById('mediaBox');
    const img = document.getElementById('qImg');
    if (q.image && q.image.trim() !== '') {
      img.src = q.image;
      mediaBox.classList.remove('empty');
    } else {
      img.src = '';
      mediaBox.classList.add('empty');
    }

    document.getElementById('qTitle').innerText = `${currentQuestionIndex + 1}. ${q.title}`;
    const ansList = document.getElementById('ansList');
    ansList.innerHTML = '';
    const state = userAnswers[`${currentTicket}-${currentQuestionIndex}`];

    q.answers.forEach((ans, idx) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.innerText = (ans.answer_text || ans.text || ans);
      const isCorrect = (ans.is_correct !== undefined) ? ans.is_correct : (idx + 1 === parseInt(q.correct, 10));

      if (state) {
        btn.disabled = true;
        if (isCorrect) btn.classList.add('correct');
        else if (state.selected === idx) btn.classList.add('wrong');
      } else {
        btn.onclick = () => handleChoice(idx, isCorrect);
      }
      ansList.appendChild(btn);
    });

    const com = document.getElementById('commentBox');
    if (state && q.comment) {
      com.innerHTML = q.comment;
      com.style.display = 'block';
    } else {
      com.style.display = 'none';
    }

    document.getElementById('prevBtn').disabled = (currentQuestionIndex === 0);
    document.getElementById('nextBtn').disabled = (currentQuestionIndex === 9);
  }

  function handleChoice(idx, isCorrect) {
    userAnswers[`${currentTicket}-${currentQuestionIndex}`] = { selected: idx, isCorrect };
    let c = 0, w = 0;
    Object.values(userAnswers).forEach(v => v.isCorrect ? c++ : w++);
    document.getElementById('correctBadge').innerText = `Верно: ${c}`;
    document.getElementById('wrongBadge').innerText = `Ошибок: ${w}`;
    renderQuestionTabs();
    renderQuestion();
  }

  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestionTabs();
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex < 9) {
      currentQuestionIndex++;
      renderQuestionTabs();
      renderQuestion();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
