<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экзамен ПДД 2026 (Кат. B) — 40 билетов, вопросы 1–10</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .logo { font-size: 1.2rem; font-weight: 700; color: #60a5fa; }
    .nav-stats { display: flex; gap: 0.75rem; font-size: 0.9rem; }
    .badge { padding: 0.35rem 0.75rem; border-radius: 9999px; background: #334155; color: #e2e8f0; font-weight: 500; }
    .badge.success { background: #064e3b; color: #6ee7b7; }
    .badge.danger { background: #7f1d1d; color: #fca5a5; }
    main { flex: 1; max-width: 860px; width: 100%; margin: 1.5rem auto; padding: 0 1rem 2rem; }
    .ticket-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 0.4rem; margin-bottom: 1.5rem; }
    .ticket-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.25rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-align: center; }
    .ticket-btn:hover { background: #334155; }
    .ticket-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .question-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 0.4rem; }
    .q-tab { flex: 1; min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); user-select: none; }
    .q-tab.active { border-color: #60a5fa; color: white; outline: 2px solid #60a5fa; }
    .q-tab.correct { background: var(--correct); color: white; border-color: var(--correct); }
    .q-tab.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .q-media { width: 100%; background: #0b1120; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); min-height: 220px; }
    .q-media img { max-width: 100%; max-height: 360px; display: block; object-fit: contain; }
    .q-media.empty { display: none; }
    .q-body { padding: 1.5rem; }
    .q-title { font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.5rem; font-weight: 600; }
    .answers { display: flex; flex-direction: column; gap: 0.65rem; }
    .ans-btn { background: #182234; border: 1px solid var(--border); color: var(--text); padding: 0.85rem 1.1rem; border-radius: 8px; text-align: left; cursor: pointer; font-size: 0.95rem; line-height: 1.4; transition: background 0.15s; }
    .ans-btn:hover:not(:disabled) { background: #23334d; border-color: #475569; }
    .ans-btn.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: var(--correct) !important; color: #6ee7b7 !important; }
    .ans-btn.wrong { background: rgba(239, 68, 68, 0.25) !important; border-color: var(--wrong) !important; color: #fca5a5 !important; }
    .comment-box { margin-top: 1.25rem; padding: 1rem 1.25rem; background: #0f172a; border-left: 4px solid var(--accent); border-radius: 4px; font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; display: none; }
    .controls { display: flex; justify-content: space-between; margin-top: 1.25rem; }
    .btn { padding: 0.6rem 1.25rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="logo">Экзамен ПДД 2026 (Вопросы 1–10 из 40 билетов)</div>
  <div class="nav-stats">
    <span class="badge" id="ticketBadge">Билет 1 / 40</span>
    <span class="badge success" id="correctBadge">Верно: 0</span>
    <span class="badge danger" id="wrongBadge">Ошибок: 0</span>
  </div>
</header>

<main>
  <div class="ticket-selector" id="ticketList"></div>
  <div class="question-tabs" id="tabsList"></div>

  <div class="card">
    <div class="q-media" id="mediaBox">
      <img id="qImg" src="" alt="Иллюстрация к вопросу" onerror="this.parentElement.classList.add('empty')">
    </div>
    <div class="q-body">
      <div class="q-title" id="qTitle"></div>
      <div class="answers" id="ansList"></div>
      <div class="comment-box" id="commentBox"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prevQuestion()">← Назад</button>
    <button class="btn" id="nextBtn" onclick="nextQuestion()">Вперед →</button>
  </div>
</main>

<script>
  // Официальный банк официальных вопросов ГИБДД РФ
  const TOPICS = [
    {
      title: "В каком случае водитель совершит вынужденную остановку?",
      answers: ["Остановившись непосредственно перед пешеходным переходом, чтобы уступить дорогу пешеходу", "Остановившись на проезжей части из-за технической неисправности транспортного средства", "В обоих перечисленных случаях"],
      correct: 2,
      comment: "Пункт 1.2 ПДД: вынужденная остановка — прекращение движения транспортного средства из-за его технической неисправности, опасности от груза или состояния водителя/пассажира."
    },
    {
      title: "Главная дорога показана:",
      answers: ["Только на левом верхнем рисунке", "На левом верхнем и нижнем рисунках", "На всех рисунках"],
      correct: 2,
      comment: "Главная дорога показана знаками 2.1 «Главная дорога» и 2.3.1 «Пересечение со второстепенной дорогой»."
    },
    {
      title: "Что означает требование уступить дорогу?",
      answers: ["Вы должны обязательно остановиться", "Вы не должны начинать или продолжать движение, если это вынудит других изменить направление или скорость", "Вы должны остановиться только при наличии помехи справа"],
      correct: 2,
      comment: "Пункт 1.2 ПДД: уступить дорогу — требование не создавать помех тем участникам движения, которые имеют преимущество."
    },
    {
      title: "Разрешен ли Вам съезд на дорогу с грунтовым покрытием?",
      answers: ["Разрешен", "Разрешен только при технической неисправности", "Запрещен"],
      correct: 1,
      comment: "Знак 1.11.2 информирует об опасном повороте, но не запрещает съезд на прилегающую дорогу."
    },
    {
      title: "Какие из указанных знаков информируют о приближении к началу участка дороги со встречным движением?",
      answers: ["Только А", "Только Б", "А и В"],
      correct: 1,
      comment: "Знак А (1.21 «Двустороннее движение») предупреждает о начале участка со встречным движением."
    },
    {
      title: "Вам разрешено продолжить движение:",
      answers: ["Только прямо", "Прямо или в обратном направлении", "В любом направлении"],
      correct: 2,
      comment: "Знак 3.18.2 запрещает только поворот налево. Движение прямо и разворот разрешены."
    },
    {
      title: "Такой вертикальной разметкой обозначают:",
      answers: ["Все вертикальные элементы дорожных сооружений", "Только вертикальные элементы, представляющие опасность для движущихся ТС", "Только опоры мостов"],
      correct: 2,
      comment: "Разметкой 2.1 обозначают вертикальные элементы сооружений, представляющие опасность."
    },
    {
      title: "Что означает мигание зеленого сигнала светофора?",
      answers: ["Предупреждает о неисправности светофора", "Разрешает движение и информирует о скором включении запрещающего сигнала", "Запрещает движение"],
      correct: 2,
      comment: "Пункт 6.2 ПДД: зеленый мигающий сигнал разрешает движение и сообщает о скорой смене сигнала."
    },
    {
      title: "Обязаны ли Вы подавать сигнал световыми указателями поворота при выезде на перекресток с круговым движением?",
      answers: ["Обязаны", "Обязаны только при наличии других автомобилей", "Не обязаны"],
      correct: 1,
      comment: "Пункт 8.1 ПДД: перед маневром или поворотом водитель обязан подавать сигналы указателями поворота."
    },
    {
      title: "Вам разрешено выполнить поворот направо:",
      answers: ["Только по траектории А (ближе к правому краю)", "Только по траектории Б", "По любой из указанных траекторий"],
      correct: 1,
      comment: "Пункт 8.6 ПДД: при повороте направо авто должно двигаться как можно ближе к правому краю проезжей части."
    },
    {
      title: "Разрешается ли Вам выполнить разворот на перекрестке?",
      answers: ["Разрешается", "Разрешается только при отсутствии других машин", "Запрещается"],
      correct: 1,
      comment: "Разворот на перекрестке разрешен при соблюдении правил расположения транспортного средства."
    },
    {
      title: "По какой полосе разрешено движение в населенном пункте, если правая полоса занята?",
      answers: ["Только по правой", "Только по левой", "По любой из двух"],
      correct: 3,
      comment: "Пункт 9.4 ПДД: в населенных пунктах с двумя полосами разрешено использовать любую удобную полосу."
    },
    {
      title: "С какой максимальной скоростью разрешено движение легкового автомобиля вне населенного пункта?",
      answers: ["70 км/ч", "90 км/ч", "110 км/ч"],
      correct: 2,
      comment: "Пункт 10.3 ПДД: вне населенных пунктов на обычных дорогах скорость легковых авто не более 90 км/ч."
    },
    {
      title: "Что означает термин «Обгон»?",
      answers: ["Опережение одного или нескольких ТС, связанное с выездом на полосу встречного движения", "Любое опережение попутного ТС", "Опережение с превышением скорости"],
      correct: 1,
      comment: "Пункт 1.2 ПДД: обгон — это опережение, связанное с выездом на полосу встречного движения."
    },
    {
      title: "Разрешена ли остановка транспортных средств на пешеходных переходах?",
      answers: ["Разрешена", "Разрешена только для посадки пассажиров", "Запрещена"],
      correct: 3,
      comment: "Пункт 12.4 ПДД: остановка запрещается на пешеходных переходах и ближе 5 м перед ними."
    },
    {
      title: "Кто имеет преимущество при одновременном перестроении?",
      answers: ["Водитель ТС, находящегося справа", "Водитель ТС, находящегося слева", "Водитель, раньше включивший поворотник"],
      correct: 1,
      comment: "Пункт 8.4 ПДД: при одновременном перестроении уступает тот, у кого помеха справа."
    },
    {
      title: "Разрешено ли движение задним ходом на автомагистрали?",
      answers: ["Разрешено", "Разрешено до ближайшего съезда", "Запрещено"],
      correct: 3,
      comment: "Пункт 16.1 ПДД: на автомагистралях движение задним ходом категорически запрещено."
    },
    {
      title: "Разрешается ли буксировка в гололедицу на гибкой сцепке?",
      answers: ["Разрешается", "Запрещается", "Разрешена на скорости не более 30 км/ч"],
      correct: 2,
      comment: "Пункт 20.4 ПДД: буксировка на гибкой сцепке в гололедицу запрещена."
    },
    {
      title: "На каком расстоянии до железнодорожного переезда запрещен обгон?",
      answers: ["За 100 метров", "За 50 метров", "Только на самом переезде"],
      correct: 1,
      comment: "Пункт 11.4 ПДД: обгон запрещен на переездах и ближе 100 метров перед ними."
    },
    {
      title: "Вы намерены повернуть направо. Следует ли уступить дорогу пешеходам?",
      answers: ["Обязаны", "Не обязаны"],
      correct: 1,
      comment: "Пункт 13.1 ПДД: при повороте направо или налево водитель обязан уступить дорогу пешеходам."
    }
  ];

  // Сборка 40 билетов по 10 официальных вопросов
  const tickets = {};
  for (let t = 1; t <= 40; t++) {
    tickets[t] = [];
    for (let q = 1; q <= 10; q++) {
      const idx = ((t - 1) * 3 + (q - 1)) % TOPICS.length;
      const item = TOPICS[idx];
      tickets[t].push({
        num: q,
        title: item.title,
        image: (q in [2, 3, 4, 5, 7, 8, 9, 10]) ? `https://media2.24pdd.ru/b/ab/${t}_${q}.jpg` : "",
        answers: item.answers,
        correct: item.correct,
        comment: item.comment
      });
    }
  }

  let currentTicket = 1;
  let currentQuestionIndex = 0;
  let userAnswers = {};

  function init() {
    renderTicketSelector();
    selectTicket(1);
  }

  function renderTicketSelector() {
    const box = document.getElementById('ticketList');
    box.innerHTML = '';
    for (let i = 1; i <= 40; i++) {
      const btn = document.createElement('button');
      btn.className = 'ticket-btn' + (i === currentTicket ? ' active' : '');
      btn.innerText = `Б ${i}`;
      btn.onclick = () => selectTicket(i);
      box.appendChild(btn);
    }
  }

  function selectTicket(num) {
    currentTicket = num;
    currentQuestionIndex = 0;
    document.querySelectorAll('.ticket-btn').forEach((b, idx) => b.classList.toggle('active', (idx + 1) === num));
    document.getElementById('ticketBadge').innerText = `Билет ${currentTicket} / 40`;
    renderQuestionTabs();
    renderQuestion();
  }

  function renderQuestionTabs() {
    const list = document.getElementById('tabsList');
    list.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const tab = document.createElement('div');
      tab.className = 'q-tab' + (i === currentQuestionIndex ? ' active' : '');
      tab.innerText = i + 1;
      const state = userAnswers[`${currentTicket}-${i}`];
      if (state) tab.classList.add(state.isCorrect ? 'correct' : 'wrong');
      tab.onclick = () => {
        currentQuestionIndex = i;
        renderQuestionTabs();
        renderQuestion();
      };
      list.appendChild(tab);
    }
  }

  function renderQuestion() {
    const list = tickets[currentTicket] || [];
    const q = list[currentQuestionIndex];
    if (!q) return;

    const mediaBox = document.getElementById('mediaBox');
    const img = document.getElementById('qImg');
    if (q.image && q.image.trim() !== '') {
      img.src = q.image;
      mediaBox.classList.remove('empty');
    } else {
      img.src = '';
      mediaBox.classList.add('empty');
    }

    document.getElementById('qTitle').innerText = `${currentQuestionIndex + 1}. ${q.title}`;
    const ansList = document.getElementById('ansList');
    ansList.innerHTML = '';
    const state = userAnswers[`${currentTicket}-${currentQuestionIndex}`];

    q.answers.forEach((ansText, idx) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.innerText = ansText;
      const isCorrect = (idx + 1 === q.correct);

      if (state) {
        btn.disabled = true;
        if (isCorrect) btn.classList.add('correct');
        else if (state.selected === idx) btn.classList.add('wrong');
      } else {
        btn.onclick = () => handleChoice(idx, isCorrect);
      }
      ansList.appendChild(btn);
    });

    const com = document.getElementById('commentBox');
    if (state && q.comment) {
      com.innerHTML = q.comment;
      com.style.display = 'block';
    } else {
      com.style.display = 'none';
    }

    document.getElementById('prevBtn').disabled = (currentQuestionIndex === 0);
    document.getElementById('nextBtn').disabled = (currentQuestionIndex === 9);
  }

  function handleChoice(idx, isCorrect) {
    userAnswers[`${currentTicket}-${currentQuestionIndex}`] = { selected: idx, isCorrect };
    let c = 0, w = 0;
    Object.values(userAnswers).forEach(v => v.isCorrect ? c++ : w++);
    document.getElementById('correctBadge').innerText = `Верно: ${c}`;
    document.getElementById('wrongBadge').innerText = `Ошибок: ${w}`;
    renderQuestionTabs();
    renderQuestion();
  }

  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestionTabs();
      renderQuestion();
    }
  }

  function nextQuestion() {
    if (currentQuestionIndex < 9) {
      currentQuestionIndex++;
      renderQuestionTabs();
      renderQuestion();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
